name: Radar Mobile Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "public/mobile/pair.html"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable signing credentials if configured
        shell: bash
        env:
          RADAR_ANDROID_KEYSTORE_B64: ${{ secrets.RADAR_ANDROID_KEYSTORE_B64 }}
          RADAR_ANDROID_STORE_PASSWORD: ${{ secrets.RADAR_ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$RADAR_ANDROID_KEYSTORE_B64" && -n "$RADAR_ANDROID_STORE_PASSWORD" ]]; then
            KEYSTORE="$RUNNER_TEMP/radar-mobile-signing.p12"
            printf '%s' "$RADAR_ANDROID_KEYSTORE_B64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            echo "RADAR_ANDROID_KEYSTORE_FILE=$KEYSTORE" >> "$GITHUB_ENV"
            echo "Stable Android signing enabled (private key hidden)."
          elif [[ -n "$RADAR_ANDROID_KEYSTORE_B64" || -n "$RADAR_ANDROID_STORE_PASSWORD" ]]; then
            echo "::error::Android signing is only partially configured. Set both GitHub Secrets."
            exit 1
          else
            echo "::warning::Signing secrets unavailable: building an ephemeral debug APK, which cannot be updated in-place."
          fi

      - name: Build Android APK
        working-directory: android
        env:
          RADAR_ANDROID_STORE_PASSWORD: ${{ secrets.RADAR_ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${RADAR_ANDROID_KEYSTORE_FILE:-}" ]]; then
            gradle --no-daemon assembleRelease
            echo "RADAR_APK_PATH=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            gradle --no-daemon assembleDebug
            echo "RADAR_APK_PATH=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - name: Verify APK signature and export signing fingerprint
        shell: bash
        run: |
          set -euo pipefail
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$SIGNER" verify --print-certs "$RADAR_APK_PATH" | tee android/signing-fingerprint.txt
          grep -q 'Signer #1 certificate SHA-256 digest:' android/signing-fingerprint.txt
          if [[ -n "${RADAR_ANDROID_KEYSTORE_FILE:-}" ]]; then
            # This hash is PUBLIC (not the signing key).
            EXPECTED_CERT="bd7d54692ca2f5f2b9dd92858f71a464810aea3ff0f6f312f635bedc95366391"
            if ! grep -Fqi "$EXPECTED_CERT" android/signing-fingerprint.txt; then
              echo "::error::The APK signature differs from Radar's permanent certificate."
              exit 1
            fi
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v5
        with:
          name: radar-2-0-mobile-apk
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release.apk
            android/signing-fingerprint.txt
          retention-days: 30
          if-no-files-found: error
