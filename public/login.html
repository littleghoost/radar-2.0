<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Radar 2.0 — Login</title>
  <style>
    :root{color-scheme:dark}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#09090b;color:#f5f5f5;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .card{width:min(92vw,420px);background:#111116;border:1px solid #24242b;border-radius:22px;padding:28px;box-shadow:0 20px 80px rgba(0,0,0,.35)}
    .eyebrow{font-size:.78rem;letter-spacing:.18em;color:#9ca3af;font-weight:700}
    h1{font-size:2.2rem;margin:8px 0 6px}
    p{color:#9ca3af;margin:0 0 22px;line-height:1.5}
    label{display:block;font-weight:650;margin-bottom:8px}
    input{width:100%;border:1px solid #30303a;border-radius:12px;background:#0c0c10;color:#fff;padding:13px 14px;font-size:1rem;outline:none}
    input:focus{border-color:#f5f5f5}
    button{width:100%;margin-top:14px;border:0;border-radius:12px;padding:13px 16px;background:#f5f5f5;color:#09090b;font-weight:800;font-size:1rem;cursor:pointer}
    .error{display:none;margin-top:14px;color:#ff7b7b}
    .error.show{display:block}
  </style>
</head>
<body>
  <main class="card">
    <span class="eyebrow">RADAR 2.0</span>
    <h1>Entrar</h1>
    <p>Área privada do seu radar de garimpo.</p>
    <form method="post" action="/login">
      <label for="password">Senha</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
      <button type="submit">Acessar Radar</button>
      <div id="error" class="error">Senha incorreta.</div>
    </form>
  </main>
  <script>
    if (new URLSearchParams(location.search).has("error")) {
      document.querySelector("#error").classList.add("show");
    }
  </script>
</body>
</html>
