app = 'radar-2-0-littleghoost'
primary_region = 'ord'

[build]

[env]
  PORT = '3000'
  DB_PATH = '/data/radar.db'

[[mounts]]
  source = 'radar_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
