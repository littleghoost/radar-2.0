plugins { id 'com.android.application' }

def stableSigningFile = System.getenv('RADAR_ANDROID_KEYSTORE_FILE')
def stableSigningPassword = System.getenv('RADAR_ANDROID_STORE_PASSWORD')

android {
 namespace 'com.littleghoost.radar2.mobile'
 compileSdk 35
 defaultConfig {
   applicationId 'com.littleghoost.radar2.mobile'
   minSdk 26
   targetSdk 35
   versionCode 4
   versionName '0.1.3'
 }
 signingConfigs {
   stable {
     if (stableSigningFile && stableSigningPassword) {
       storeFile file(stableSigningFile)
       storePassword stableSigningPassword
       keyAlias 'radarmobile'
       keyPassword stableSigningPassword
       storeType 'pkcs12'
     }
   }
 }
 buildTypes {
   release {
     minifyEnabled false
     if (stableSigningFile && stableSigningPassword) {
       signingConfig signingConfigs.stable
     }
   }
 }
 compileOptions {
   sourceCompatibility JavaVersion.VERSION_17
   targetCompatibility JavaVersion.VERSION_17
 }
}
